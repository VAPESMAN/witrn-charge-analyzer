<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻洞 - 充电测试数据分析</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <img src="{{ url_for('static', filename='logo.svg') }}" alt="轻洞" />
                </div>
                <span class="brand-name">轻洞</span>
            </div>
            <p class="brand-tagline">充电测试数据分析工具</p>
        </header>

        <main class="main">
            <div class="card upload-card">
                <h2>上传充电数据</h2>

                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="drop-zone-title">拖拽 CSV 文件到此处</p>
                    <p class="drop-zone-hint">或点击选择文件</p>
                    <input type="file" id="csvFile" accept=".csv">
                </div>

                <div class="file-info" id="fileInfo" style="display: none;">
                    <span class="file-name" id="fileName"></span>
                    <button class="btn-text" id="clearFile">移除</button>
                </div>

                <div class="form-group">
                    <label for="deviceModel">测试机型</label>
                    <input type="text" id="deviceModel" placeholder="例如：红米K80 Ultra">
                </div>

                <button class="btn-primary" id="generateBtn">
                    <span class="btn-text">生成报告</span>
                    <span class="spinner" style="display: none;"></span>
                </button>

                <div class="status" id="status" style="display: none;"></div>
            </div>

            <div class="card result-card" id="resultCard" style="display: none;">
                <h3>分析结果</h3>
                <div class="stat-grid" id="statGrid"></div>
                <div class="actions">
                    <a class="btn-primary" id="viewReport" target="_blank">查看报告</a>
                    <button class="btn-secondary" id="resetBtn">重新上传</button>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>轻洞 &copy; 2026</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
